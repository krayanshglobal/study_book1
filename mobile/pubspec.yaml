name: studybook_mobile
description: A premium native Flutter Android application for StudyBook student management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  connectivity_plus: ^5.0.2
  google_fonts: ^6.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  lucide_icons: ^0.257.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  path_provider: ^2.1.3
  image_picker: ^1.1.1
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/studybook_logo.png
